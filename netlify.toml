# Netlify configuration for a Git-connected deploy of bluetensturm.com.
#
# For a drag-and-drop deploy, use the zip from scripts/pack-netlify.sh
# instead — that carries its own _headers file and needs no build step.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Vite fingerprints every file in /assets, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The entry document must always be revalidated, or a deploy ships new
# hashed assets that nobody's browser ever asks for.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
